[project]
name = "retrievalcheck"
version = "0.2.0"
description = "Measure any RAG or AI search system in one command: recall, MRR, nDCG, answer accuracy, latency — and compare before/after."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Boulares", email = "nada.boulaares@gmail.com" }]
requires-python = ">=3.11"
dependencies = []  # standard library only

keywords = ["rag", "retrieval", "evaluation", "llm", "semantic-search", "information-retrieval", "mrr", "ndcg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/nadaboulaares/ragcheck"
Issues = "https://github.com/nadaboulaares/ragcheck/issues"
Changelog = "https://github.com/nadaboulaares/ragcheck/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragcheck = "ragcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # "a b c".split() reads better than a 40-item list literal for the stopwords
