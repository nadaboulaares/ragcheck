[project]
name = "ragcheck"
version = "0.1.0"
description = "Measure any RAG or AI search system in one command: recall, MRR, nDCG, answer accuracy, latency — and compare before/after."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Boulares", email = "nada.boulaares@gmail.com" }]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragcheck = "ragcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
