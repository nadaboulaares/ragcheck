[project]
name = "ragcheck"
version = "0.1.0"
description = "Measure any RAG or AI search system in one command: recall, MRR, nDCG, answer accuracy, latency — and compare before/after."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Boulares", email = "nada.boulaares@gmail.com" }]
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragcheck = "ragcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["SIM905"]  # "a b c".split() reads better than a 40-item list literal for the stopwords
